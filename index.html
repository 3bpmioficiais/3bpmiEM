<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d10">
<title>Gestão EM - 3º B.C.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')</script>
<style>
:root{--bg:#0f1216;--panel:#171b21;--linha:#262c35;--txt:#e9ecf1;--mut:#8b94a3;--red:#c8102e;--red2:#e0203f;--ok:#2ed573}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:12px 28px;background:#0b0d10;border-bottom:2px solid var(--red)}
header img{height:44px}
header .marca{flex:1;line-height:1.25}
header b{font-size:1rem}
header small{display:block;color:var(--mut)}
#usuario{color:var(--mut);font-size:.8rem}
nav{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--linha);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:14px 16px;font:inherit;cursor:pointer;white-space:nowrap}
nav button[aria-current=true]{color:var(--txt);border-color:var(--red)}
main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:30px 28px}
h1{font-size:1.3rem;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:stretch;grid-auto-flow:row}
.card{background:var(--panel);border:1px solid var(--linha);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px;position:relative;transition:border-color .15s,box-shadow .15s;min-width:0;min-height:220px}
.card:hover{border-color:#3a4454}
.card h2{font-size:1.02rem;letter-spacing:.01em}
a.card{color:inherit;text-decoration:none;position:relative;cursor:pointer}
a.card:hover{border-color:var(--red);box-shadow:0 4px 16px rgba(200,16,46,.15);transform:translateY(-1px)}
a.card p{color:var(--mut);font-size:.875rem}

/* ===== Card em Destaque: Numerador Eletrônico (Principal Ferramenta) ===== */
.card-numerador-hero{
  grid-column:1 / -1;
  min-height:190px;
  background:linear-gradient(135deg,#1c212a 0%,#13171d 100%);
  border:1px solid rgba(200,16,46,.5);
  border-left:6px solid var(--red);
  border-radius:12px;
  padding:24px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:24px;
  box-shadow:0 6px 24px rgba(0,0,0,.45);
  position:relative;
  overflow:hidden;
}
.card-numerador-hero::after{
  content:"";
  position:absolute;
  top:-20px;
  right:-20px;
  width:180px;
  height:180px;
  background:radial-gradient(circle,rgba(200,16,46,.18) 0%,transparent 70%);
  pointer-events:none;
}
.card-num-info{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-width:700px;
  position:relative;
  z-index:1;
}
.card-num-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(200,16,46,.2);
  color:#ff6b81;
  border:1px solid rgba(200,16,46,.4);
  border-radius:20px;
  padding:3px 10px;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  width:fit-content;
}
.card-num-badge svg{flex:none}
.card-numerador-hero h2{
  font-size:1.25rem;
  font-weight:700;
  color:#fff;
  margin:0;
  display:flex;
  align-items:center;
  gap:10px;
}
.card-numerador-hero p{
  color:#a5afbf;
  font-size:.9rem;
  line-height:1.45;
  margin:0;
}
.card-num-acao{
  flex-shrink:0;
  position:relative;
  z-index:1;
}
.btn-numerador-destaque{
  background:var(--red);
  color:#fff;
  border:0;
  border-radius:8px;
  padding:14px 26px;
  font-size:.95rem;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:10px;
  white-space:nowrap;
  box-shadow:0 4px 16px rgba(200,16,46,.45);
  transition:background .15s,transform .1s,box-shadow .15s;
}
.btn-numerador-destaque:hover{
  background:var(--red2);
  transform:translateY(-1px);
  box-shadow:0 6px 22px rgba(200,16,46,.6);
}
.btn-numerador-destaque:active{
  transform:translateY(0);
}

/* ===== Tags e Elementos Auxiliares dos Cards ===== */
.card-topo-tag{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:-4px}
.card-tag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:4px}
.tag-azul{background:rgba(46,134,222,.15);color:#54a0ff;border:1px solid rgba(46,134,222,.3)}
.tag-verde{background:rgba(46,213,115,.15);color:#2ed573;border:1px solid rgba(46,213,115,.3)}
.tag-laranja{background:rgba(255,159,67,.15);color:#ff9f43;border:1px solid rgba(255,159,67,.3)}
.tag-cinza{background:rgba(139,148,163,.15);color:#8b94a3;border:1px solid rgba(139,148,163,.3)}
.card-link-icone{color:var(--mut);font-size:1.1rem;line-height:1}
a.card:hover .card-link-icone{color:var(--red)}
.card-rodape{margin-top:auto;padding-top:6px;display:flex;flex-direction:column;gap:8px}
.card-inq-rodape{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
label{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--mut);font-weight:600}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--linha);border-radius:6px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn{background:var(--red);color:#fff;border:0;border-radius:6px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--red2)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:none;border:1px solid var(--linha);color:var(--txt)}
.btn.ghost:hover{border-color:var(--mut)}
.cont{color:var(--mut);font-size:.85rem}
.acoes{display:flex;gap:10px;justify-content:flex-end}
dialog{margin:auto;background:var(--panel);color:var(--txt);border:1px solid var(--linha);border-top:3px solid var(--red);border-radius:8px;padding:24px;width:min(720px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog form,.col{display:flex;flex-direction:column;gap:14px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.tw{overflow:auto;margin-top:14px;max-height:55vh}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:10px;border-bottom:1px solid var(--linha);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
td.nw{white-space:nowrap}
.mini{background:none;border:1px solid var(--linha);color:var(--txt);border-radius:4px;padding:4px 10px;cursor:pointer;font:inherit;font-size:.78rem}
.mini:hover{border-color:var(--mut)}
.mini.perigo:hover{border-color:var(--red);color:#ff6b81}
.overlay{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:20px}
.overlay[hidden]{display:none}
.overlay .card{width:min(400px,100%);text-align:center}
.overlay img{width:96px;margin:0 auto}
.msg-erro{color:#ff6b81;font-size:.85rem}
#toasts{position:fixed;inset:auto 20px 20px auto;margin:0;padding:0;border:0;background:none;overflow:visible;width:auto;color:inherit;z-index:100}
#toasts:popover-open{display:grid;gap:8px}
.toast{background:#1f2a33;border-left:3px solid var(--ok);padding:12px 16px;border-radius:6px;font-size:.875rem;max-width:340px}
.toast.erro{border-color:var(--red)}
footer{text-align:center;color:var(--mut);font-size:.75rem;padding:20px}
@media (min-width:1200px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card-numerador-hero{grid-column:1 / -1}}
@media (min-width:601px) and (max-width:900px){main{padding-inline:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}}
@media (max-width:600px){header,nav{padding-inline:16px}main{padding:24px 16px}}
/* ===== Ajustes exclusivos para dispositivos móveis ===== */
@media (max-width:600px){
  body{font-size:16px}
  header{flex-wrap:wrap;gap:10px 12px;padding-block:10px}
  header img{height:38px}
  header .marca{flex:1 1 calc(100% - 50px);min-width:0;line-height:1.2}
  header b{font-size:min(.9rem,calc((100vw - 90px)/22));display:block;white-space:nowrap}
  header small{font-size:min(.75rem,calc((100vw - 90px)/24));margin-top:3px;line-height:1.3;white-space:nowrap}
  #usuario{order:3;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.75rem}
  #sair{order:4;padding:8px 14px}
  nav{gap:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{padding:13px 14px;font-size:.9rem}
  main{padding:20px 16px}
  h1{font-size:1.15rem;margin-bottom:16px}
  .grid{grid-template-columns:minmax(0,1fr);gap:16px}
  .card{padding:18px;gap:12px}
  .card-numerador-hero{flex-direction:column;align-items:stretch;padding:18px;gap:16px}
  .card-numerador-hero h2{font-size:1.15rem}
  .btn-numerador-destaque{width:100%;justify-content:center;padding:13px}
  input,select,textarea{font-size:16px;min-height:44px;width:100%}
  textarea{min-height:96px}
  .btn{min-height:44px;padding:12px 16px}
  .mini{min-height:36px;padding:6px 12px}
  .acoes{flex-direction:column-reverse}
  .acoes .btn{width:100%}
  dialog{width:calc(100vw - 24px);max-height:92vh;padding:18px}
  .topo{flex-wrap:wrap}
  .tw{max-height:62vh;margin-top:12px}
  table,tbody{display:block}
  thead{display:none}
  tbody tr{display:block;padding:12px 0;border-bottom:1px solid var(--linha)}
  tbody tr:last-child{border-bottom:0}
  th,td{border-bottom:0}
  td{display:block;padding:3px 0;white-space:normal}
  td.nw{white-space:normal}
  td:not([colspan])::before{display:block;color:var(--mut);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  td:not([colspan]):nth-child(1)::before{content:"Número"}
  td:not([colspan]):nth-child(2)::before{content:"Data"}
  td:not([colspan]):nth-child(3)::before{content:"Assunto"}
  td:not([colspan]):nth-child(4){display:flex;gap:8px;padding-top:8px}
  td:not([colspan]):nth-child(4)::before{content:none}
  td:not([colspan]):nth-child(4) .mini{flex:1}
  #toasts{left:12px;right:12px;bottom:12px}
  .toast{max-width:none}
  footer{padding:16px}
}
@media (max-width:360px){header img{height:34px}}
/* ===== Estilos do Controle de Frequência ===== */
h3{font-size:.95rem}
input[type=checkbox]{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--red);flex:none}
.chk{flex-direction:row;align-items:center;gap:10px;color:var(--txt);font-size:.92rem;font-weight:500;cursor:pointer}
.fr-form{border:1px solid var(--linha);border-radius:8px;padding:16px;margin:16px 0;background:var(--bg);display:flex;flex-direction:column;gap:14px}
.dupla,.horas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tp{border-bottom:1px solid var(--linha);padding:9px 0}
.tp:last-of-type{border-bottom:0}
.tp-corpo{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px 28px}
.tp-corpo[hidden]{display:none}
.tp-corpo textarea{min-height:64px}
.fr-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.fr-topo select{max-width:100%}
.fr-dia{border:1px solid var(--linha);border-radius:8px;margin-bottom:14px;overflow:hidden}
.fr-dia-cab{background:#1c2128;border-bottom:1px solid var(--linha);border-left:3px solid var(--red);padding:9px 14px;font-size:.9rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fr-dia-cab span{color:var(--mut);font-size:.8rem}
.fr-item{padding:12px 14px;border-bottom:1px solid var(--linha);display:flex;flex-direction:column;gap:6px}
.fr-item:last-child{border-bottom:0}
.fr-cab{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.tag{background:#262c35;border-radius:4px;padding:2px 8px;font-size:.72rem;color:var(--mut);font-weight:600}
.fr-item p{font-size:.88rem}
.fr-acoes{display:flex;gap:8px}
@media (max-width:600px){.dupla,.horas{grid-template-columns:1fr}.tp-corpo{margin-left:0}.fr-acoes .mini{flex:1}}
/* ===== Revisão: correções de compatibilidade ===== */
:root{color-scheme:dark}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
body:has(dialog[open]){overflow:hidden}
header{padding-top:max(12px,env(safe-area-inset-top))}
footer{padding-bottom:max(20px,env(safe-area-inset-bottom))}
dialog{max-height:88vh;max-height:88dvh;overscroll-behavior:contain}
dialog input[type=search],#sSenha{width:100%}
th{position:sticky;top:0;background:var(--panel)}
.overlay{overflow:auto}
@media (max-width:600px){dialog{max-height:92vh;max-height:92dvh}input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0}input[type=checkbox]{width:22px;height:22px}}
</style>
</head>
<body>

<!-- Tela de login -->
<div id="login" class="overlay" hidden>
  <form id="fLogin" class="card">
    <img src="Brasão_3BC.png" alt="Brasão do 3º B.C." onerror="this.hidden=true">
    <h2>Acesso restrito</h2>
    <label>E-mail da seção<input type="email" id="lEmail" autocomplete="username" required></label>
    <label>Senha<input type="password" id="lSenha" autocomplete="current-password" required></label>
    <p id="erroLogin" class="msg-erro" hidden></p>
    <button class="btn" id="bLogin">Entrar</button>
  </form>
</div>

<header>
  <img src="Brasão_3BC.png" alt="" onerror="this.hidden=true">
  <div class="marca"><b>Polícia Militar do Estado de São Paulo</b><small>Painel de Gestão · 3º Batalhão de Caçadores</small></div>
  <span id="usuario"></span>
  <button class="btn ghost" id="sair" hidden>Sair</button>
</header>
<nav id="abas" hidden></nav>
<main id="conteudo"></main>
<footer>Uso restrito · 3º Batalhão de Caçadores</footer>

<!-- Registros de inquéritos -->
<dialog id="dReg">
  <div class="topo"><h2 id="rTitulo"></h2><button class="mini" data-fechar>Fechar</button></div>
  <input type="search" id="rBusca" placeholder="Buscar por número, data ou assunto" aria-label="Buscar">
  <div class="tw"><table><thead><tr><th>Número</th><th>Data</th><th>Assunto</th><th></th></tr></thead><tbody id="rCorpo"></tbody></table></div>
</dialog>

<!-- Editar registro -->
<dialog id="dEd">
  <form id="fEd">
    <h2 id="eTitulo">Editar registro</h2>
    <label>Data de Instauração<input type="date" id="eData" required></label>
    <label>Assunto<textarea id="eAssunto" required></textarea></label>
    <div class="acoes"><button type="button" class="btn ghost" data-fechar>Cancelar</button><button class="btn">Salvar alterações</button></div>
  </form>
</dialog>

<!-- Controle de Frequência -->
<dialog id="dFreq">
  <div class="topo"><h2 id="dFreqTitulo">Controle de Frequência</h2><button class="mini" data-fechar>Fechar</button></div>
  <div class="dupla"><label>Mês de referência<select id="fMesSel"></select></label><label>Ano<select id="fAnoSel"></select></label></div>
  <form id="fFreq" class="fr-form">
    <h3>Novo lançamento</h3>
    <div class="dupla">
      <label>Data<input type="date" id="fData" required></label>
      <label>Efetivo<select id="fPol" required></select></label>
    </div>
    <div id="fTipos"></div>
    <div class="acoes"><button class="btn">Registrar lançamento</button></div>
  </form>
  <div class="fr-topo">
    <h3>Lançamentos de <span id="fMesNome"></span></h3>
    <select id="fFiltro" aria-label="Filtrar por policial"></select>
  </div>
  <div id="fLista"></div>
</dialog>

<!-- Editar lançamento de frequência -->
<dialog id="dFreqEd">
  <form id="fFreqEd">
    <h2 id="feTitulo">Editar lançamento</h2>
    <label>Data<input type="date" id="feData" required></label>
    <label>Texto<textarea id="feTexto" required></textarea></label>
    <div class="acoes"><button type="button" class="btn ghost" data-fechar>Cancelar</button><button class="btn">Salvar alterações</button></div>
  </form>
</dialog>

<!-- Confirmação por senha -->
<dialog id="dSenha">
  <form id="fSenha">
    <h2>Confirme sua senha</h2>
    <p id="sTexto" class="cont"></p>
    <input type="password" id="sSenha" autocomplete="current-password" aria-label="Senha" required>
    <p id="sErro" class="msg-erro" hidden>Senha incorreta.</p>
    <div class="acoes"><button type="button" class="btn ghost" data-fechar>Cancelar</button><button class="btn" id="bSenha">Confirmar</button></div>
  </form>
</dialog>

<div id="toasts" popover="manual" role="status" aria-live="polite"></div>

      {id:'data_evento', label:'Data do evento', tipo:'date', req:1},
      {id:'nome_evento', label:'Nome da solenidade ou evento', tipo:'text', req:1, ph:'Ex: Passagem de Comando'},
      {id:'local_evento', label:'Local', tipo:'text'},
      {id:'descricao_evento', label:'Descrição e observações', tipo:'textarea'}
    ]
  }
};

// Seções e organização dos cards (Numerador Eletrônico sempre prioritário)
const SECOES = {
  oficiais: {nome:'Oficiais - EM · CFP', itens:[
    {freq:true},
    {link:'CALENDÁRIO DE FOLGAS', texto:'Folgas programadas dos Oficiais do Batalhão.', url:'https://calendar.google.com/calendar/embed?src=3bpmioficiais%40gmail.com&ctz=America%2FSao_Paulo'},
    {form:'folga'}
  ]},
  p1: {nome:'P/1 · Seç Pes', itens:[
    {numerador:true},
    {freq:true},
    {link:'EFETIVO', texto:'Controle de pessoal e disponibilidade da tropa.', url:'https://docs.google.com/spreadsheets/d/1AMWgGsep2hu1gIB7h6hqOBqyu3tgyKZ0FChFaM9GAOk/edit?usp=drive_link'}
  ]},
  p3: {nome:'P/3 · Seç Op', itens:[
    {numerador:true},
    {freq:true},
    {link:'CALENDÁRIO DE OPERAÇÕES', texto:'Calendário de Operações.', url:'https://calendar.google.com/calendar/embed?src=0825099768be603c9f8bcfb99fdd6c322279e525ca4a6929693938275d6592f4%40group.calendar.google.com&ctz=America%2FSao_Paulo'},
    {form:'operacao'}
  ]},
  p4: {nome:'P/4 · Seç Log', itens:[
    {numerador:true},    
    {freq:true},
    {link:'VIATURAS', texto:'Frota, manutenção e disponibilidade dos veículos oficiais.', url:'https://docs.google.com/spreadsheets/d/19HPuo13AXZRe3hMUMIQBvqwq9lf-hLsbTUOxkqDMi4c/edit?usp=drive_link'}
  ]},
  p5: {nome:'P/5 · Seç ComSoc', itens:[
    {numerador:true},
    {link:'CALENDÁRIO DE SOLENIDADES', texto:'Calendário de Solenidades / Eventos do Batalhão.', url:'https://calendar.google.com/calendar/embed?src=c4e06b5453a15e7965978a2e937a2b7cd3738a308709aefa84361f80ce013f8f%40group.calendar.google.com&ctz=America%2FSao_Paulo'},
    {form:'evento'}
  ]},
  sjd: {nome:'SPJMD · Seç PJMD', itens:[
    {numerador:true},   
    {freq:true},
    {inq:'IPM'},
    {inq:'IP'},
    {inq:'Sindicância'}
  ]}
};
window.SECOES = SECOES;

/* =====================================================================
   2) CÓDIGO DO SISTEMA
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtData = d => d ? d.split('-').reverse().join('/') : '';
const fmtNum = r => `${String(r.numeracao).padStart(3,'0')}/${CONFIG.CODIGO}/${r.ano}`;

if (!window.supabase) {
  document.body.innerHTML = '<p style="padding:24px">Não foi possível carregar o sistema (biblioteca de acesso). Verifique a internet e recarregue a página.</p>';
  throw new Error('supabase indisponível');
}
const db = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
window.db = db;

let usuario = null, perfil = null, tipoAtual = '', registros = [], editando = null;
let secaoAtual = 'p3';
window.secaoAtual = 'p3';

function aviso(msg, erro) {
  const box = $('#toasts'), t = document.createElement('div');
  t.className = 'toast' + (erro ? ' erro' : ''); t.textContent = msg; box.append(t);
  try { if (box.showPopover) { if (box.matches(':popover-open')) box.hidePopover(); box.showPopover(); } } catch {}
  setTimeout(() => { t.remove(); if (!box.children.length) try { box.hidePopover?.(); } catch {} }, 5000);
}
window.aviso = aviso;

/* ---------- Login e sessão ---------- */
$('#fLogin').onsubmit = async e => {
  e.preventDefault();
  const b = $('#bLogin'), er = $('#erroLogin');
  b.disabled = true; er.hidden = true;
  const { error } = await db.auth.signInWithPassword({ email: $('#lEmail').value.trim(), password: $('#lSenha').value });
  b.disabled = false;
  if (error) {
    er.textContent = error.status === 400 ? 'E-mail ou senha incorretos.' : 'Não foi possível conectar. Verifique a internet e tente novamente.';
    er.hidden = false; return;
  }
  $('#lSenha').value = '';
  marcarUso();
  iniciar();
};

async function iniciar() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { $('#login').hidden = false; return; }
  usuario = session.user;
  window.usuario = usuario;
  if (!usoRecente()) { await sair(); return; }
  const { data, error } = await db.from('perfis').select('secao').maybeSingle();
  if (error) { $('#login').hidden = false; $('#erroLogin').textContent = 'Não foi possível carregar seu perfil. Verifique a internet e tente novamente.'; $('#erroLogin').hidden = false; return; }
  perfil = data?.secao;
  if (!perfil) {
    await db.auth.signOut();
    $('#login').hidden = false;
    aviso('Seu e-mail não está vinculado a nenhuma seção. Procure o administrador.', 1);
    return;
  }
  $('#login').hidden = true;
  $('#usuario').textContent = usuario.email;
  $('#sair').hidden = false;
  montar();
  vigiarInatividade();
}

async function sair() {
  try { const r = await db.auth.signOut(); if (r.error) await db.auth.signOut({ scope: 'local' }); } catch {}
  try { localStorage.removeItem(K_USO); } catch {}
  location.reload();
}
$('#sair').onclick = sair;

const K_USO = 'gem_ultimo_uso';
const marcarUso = () => { try { localStorage.setItem(K_USO, Date.now()); } catch {} };
const usoRecente = () => { try { const t = +localStorage.getItem(K_USO); return !t || Date.now() - t < CONFIG.MINUTOS_INATIVIDADE * 60000; } catch { return true; } };
let relogio, vigiando = false;
function vigiarInatividade() {
  if (vigiando) return; vigiando = true;
  let ult = 0;
  const zerar = () => { marcarUso(); clearTimeout(relogio); relogio = setTimeout(sair, CONFIG.MINUTOS_INATIVIDADE * 60000); };
  const lim = () => { const n = Date.now(); if (n - ult > 1000) { ult = n; zerar(); } };
  ['click','keydown','mousemove','pointerdown','touchstart','touchmove','scroll'].forEach(ev => addEventListener(ev, lim, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !usoRecente()) sair(); });
  db.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && usuario) location.reload(); });
  zerar();
}

/* ---------- Navegação entre seções ---------- */
function permitidas() { return perfil === 'admin' ? Object.keys(SECOES) : [perfil].filter(k => SECOES[k]); }

function montar() {
  const chaves = permitidas();
  $('#abas').hidden = chaves.length < 2;
  $('#abas').innerHTML = chaves.map(k => `<button data-aba="${k}">${esc(SECOES[k].nome)}</button>`).join('');
  onhashchange = () => abrir(location.hash.slice(1));
  abrir(location.hash.slice(1));
}

function abrir(k) {
  const chaves = permitidas();
  if (!chaves.includes(k)) k = chaves[0];
  if (!k) return;
  secaoAtual = k;
  window.secaoAtual = k;
  document.querySelectorAll('#abas button').forEach(b => b.setAttribute('aria-current', b.dataset.aba === k));
  // Garante que o Numerador Eletrônico seja sempre o primeiro card, independentemente da ordem cadastrada.
  const itensOrdenados = [...SECOES[k].itens].sort((a, b) => Number(!!b.numerador) - Number(!!a.numerador));
  $('#conteudo').innerHTML = `<h1>${esc(SECOES[k].nome)}</h1><div class="grid">${itensOrdenados.map(desenharItem).join('')}</div>`;
  document.querySelector('#abas [aria-current=true]')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  contar();

  // Oculta o botão do cabeçalho se estiver na aba de Oficiais
  const btnNum = $('#btnNumerador');
  if (btnNum) btnNum.hidden = (k === 'oficiais');
}
$('#abas').onclick = e => { const b = e.target.closest('[data-aba]'); if (b) location.hash = b.dataset.aba; };

function desenharItem(i) {
  if (i.numerador) {
    return `<div class="card card-numerador-hero">
      <div class="card-num-info">
        <div class="card-num-badge">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          MAIS UTILIZADO · ACESSO PRIORITÁRIO
        </div>
        <h2>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          NUMERADOR ELETRÔNICO
        </h2>
        <p>Emissão e controle sequencial oficial de documentos da seção (Mensagens, Ofícios, Memorandos, Partes, NBIs e Ordens de Serviço).</p>
      </div>
      <div class="card-num-acao">
        <button class="btn btn-numerador-destaque" data-numerador>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          Abrir Numerador
        </button>
      </div>
    </div>`;
  }

  if (i.freq) {
    return `<div class="card">
      <div class="card-topo-tag">
        <span class="card-tag tag-azul">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Gestão de Efetivo
        </span>
      </div>
      <h2>CONTROLE DE FREQUÊNCIA</h2>
      <p class="cont">Lançamentos de folgas, meios-expedientes, inversões de serviço e demais alterações de escala.</p>
      <div class="card-rodape">
        <button class="btn" data-freq>Abrir Controle de Frequência</button>
      </div>
    </div>`;
  }

  if (i.link) {
    const isAgenda = i.link.includes('CALENDÁRIO') || i.link.includes('FOLGAS');
    return `<a class="card" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">
      <div class="card-topo-tag">
        <span class="card-tag ${isAgenda ? 'tag-laranja' : 'tag-verde'}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          ${isAgenda ? 'Google Agenda' : 'Planilha Online'}
        </span>
        <span class="card-link-icone">↗</span>
      </div>
      <h2>${esc(i.link)}</h2>
      <p>${esc(i.texto)}</p>
    </a>`;
  }

  if (i.inq) {
    const nomeInq = i.inq === 'IPM' ? 'INQUÉRITO POLICIAL MILITAR - IPM' : i.inq === 'IP' ? 'INQUÉRITO POLICIAL - IP' : 'SINDICÂNCIA';
    return `<div class="card">
      <div class="card-topo-tag">
        <span class="card-tag tag-cinza">Polícia Judiciária Militar</span>
      </div>
      <h2>${nomeInq}</h2>
      <form class="col" data-inq="${i.inq}">
        <label>Data de Instauração<input type="date" name="data" required></label>
        <label>Assunto<textarea name="assunto" required placeholder="Descreva a portaria ou síntese do fato"></textarea></label>
        <button class="btn">Cadastrar ${i.inq}</button>
      </form>
      <div class="card-inq-rodape">
        <button class="btn ghost" data-ver="${i.inq}">Ver registros</button>
        <p class="cont">Total instaurados: <b id="cont${i.inq}">-</b></p>
      </div>
    </div>`;
  }

  const f = FORMS[i.form];
  const campos = f.campos.map(c => {
    const at = `id="${c.id}" name="${c.id}"${c.req ? ' required' : ''} placeholder="${esc(c.ph || '')}"`;
    const el = c.tipo === 'select' ? `<select id="${c.id}" name="${c.id}"${c.req ? ' required' : ''}><option value="">Selecione</option>${c.opcoes.map(o => `<option>${esc(o)}</option>`).join('')}</select>`
      : c.tipo === 'textarea' ? `<textarea ${at}></textarea>` : `<input type="${c.tipo}" ${at}>`;
    return `<label>${esc(c.label)}${el}</label>`;
  }).join('');
  return `<div class="card">
    <div class="card-topo-tag">
      <span class="card-tag tag-laranja">Registro Operacional</span>
    </div>
    <h2>${esc(f.titulo)}</h2>
    <form class="col" data-form="${i.form}">${campos}<button class="btn">${esc(f.botao)}</button></form>
  </div>`;
}

/* ---------- Envio dos formulários ---------- */
$('#conteudo').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, b = $('button', f), txt = b.textContent;
  b.disabled = true; b.textContent = 'Enviando…';
  try {
    if (f.dataset.inq) await cadastrarInq(f); else await enviarForm(f);
  } catch (err) { console.error(err); aviso('Não foi possível concluir. Tente novamente.', 1); }
  b.disabled = false; b.textContent = txt;
});

async function enviarForm(f) {
  const def = FORMS[f.dataset.form], d = {};
  def.campos.forEach(c => d[c.id] = f.elements[c.id].value);
  const msg = def.validar?.(d);
  if (msg) return aviso(msg, 1);
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(def.url, { method: 'POST', body: new URLSearchParams({ acao: def.acao, ...d }), signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
  } finally { clearTimeout(to); }
  aviso(def.ok); f.reset();
}

/* ---------- Inquéritos (IPM / IP / SINDICÂNCIA) ---------- */
async function cadastrarInq(f) {
  const t = f.dataset.inq;
  const { data, error } = await db.from('inqueritos_pm')
    .insert({ tipo: t, data_instauracao: f.elements.data.value, assunto: f.elements.assunto.value.trim() })
    .select().single();
  if (error) throw error;
  aviso(`${t} cadastrado: ${CONFIG.UNIDADE} - ${fmtNum(data)}`);
  f.reset(); contar();
}

async function contar() {
  await Promise.all(['IPM', 'IP', 'Sindicância'].map(async t => {
    const el = $('#cont' + t); if (!el) return;
    const { count } = await db.from('inqueritos_pm').select('*', { count: 'exact', head: true }).eq('tipo', t).eq('excluido', false);
    el.textContent = count ?? '-';
  }));
}

$('#conteudo').addEventListener('click', e => {
  const b = e.target.closest('[data-ver]');
  if (b) { tipoAtual = b.dataset.ver; $('#rTitulo').textContent = `Registros de ${tipoAtual}`; $('#rBusca').value = ''; $('#dReg').showModal(); carregar(); }
});

async function carregar() {
  const t = tipoAtual; registros = [];
  $('#rCorpo').innerHTML = '<tr><td colspan="4">Carregando…</td></tr>';
  const { data, error } = await db.from('inqueritos_pm').select('*').eq('tipo', t).eq('excluido', false).order('numeracao', { ascending: false });
  if (t !== tipoAtual) return;
  if (error) { $('#rCorpo').innerHTML = '<tr><td colspan="4" class="msg-erro">Erro ao carregar os registros.</td></tr>'; return; }
  registros = data; listar();
}

function listar() {
  const q = $('#rBusca').value.toLowerCase();
  const l = registros.filter(r => `${fmtNum(r)} ${fmtData(r.data_instauracao)} ${r.assunto}`.toLowerCase().includes(q));
  $('#rCorpo').innerHTML = l.length ? l.map(r => `<tr>
      <td class="nw"><b>${fmtNum(r)}</b></td><td class="nw">${fmtData(r.data_instauracao)}</td><td>${esc(r.assunto)}</td>
      <td class="nw"><button class="mini" data-ed="${esc(r.id)}">Editar</button> <button class="mini perigo" data-ex="${esc(r.id)}">Excluir</button></td></tr>`).join('')
    : '<tr><td colspan="4" class="cont">Nenhum registro encontrado.</td></tr>';
}
$('#rBusca').oninput = listar;

$('#rCorpo').addEventListener('click', async e => {
  const bEd = e.target.closest('[data-ed]'), bEx = e.target.closest('[data-ex]');
  if (!bEd && !bEx) return;
  const r = registros.find(x => String(x.id) === (bEd || bEx).dataset[bEd ? 'ed' : 'ex']);
  if (!r) return;
  if (bEd) {
    if (!await confirmarSenha(`Editar ${tipoAtual} ${fmtNum(r)}.`)) return;
    editando = r;
    $('#eTitulo').textContent = `Editar ${tipoAtual} ${fmtNum(r)}`;
    $('#eData').value = r.data_instauracao; $('#eAssunto').value = r.assunto;
    $('#dEd').showModal();
  } else {
    if (!await confirmarSenha(`Excluir ${tipoAtual} ${fmtNum(r)}. O registro sai da lista e fica guardado no histórico.`)) return;
    const { error } = await db.from('inqueritos_pm').update({ excluido: true }).eq('id', r.id);
    if (error) return aviso('Não foi possível excluir. Verifique sua permissão.', 1);
    aviso('Registro excluído.'); carregar(); contar();
  }
});

$('#fEd').onsubmit = async e => {
  e.preventDefault();
  const { error } = await db.from('inqueritos_pm').update({ data_instauracao: $('#eData').value, assunto: $('#eAssunto').value.trim() }).eq('id', editando.id);
  if (error) return aviso('Não foi possível salvar. Verifique sua permissão.', 1);
  $('#dEd').close(); aviso('Registro atualizado.'); carregar();
};

/* ---------- Confirmação por senha (para editar e excluir) ---------- */
function confirmarSenha(texto) {
  return new Promise(resolve => {
    const d = $('#dSenha'); let tentativas = 0;
    $('#sTexto').textContent = texto; $('#sSenha').value = ''; $('#sErro').hidden = true;
    d.returnValue = ''; d.showModal(); $('#sSenha').focus();
    d.onclose = () => resolve(d.returnValue === 'ok');
    $('#fSenha').onsubmit = async e => {
      e.preventDefault();
      const b = $('#bSenha'); b.disabled = true;
      const teste = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'gem-verificacao' } });
      const { error } = await teste.auth.signInWithPassword({ email: usuario.email, password: $('#sSenha').value });
      b.disabled = false;
      if (!error) return d.close('ok');
      $('#sErro').hidden = false; $('#sSenha').value = '';
      if (++tentativas >= 3) { d.close('cancel'); aviso('Muitas tentativas incorretas.', 1); }
    };
  });
}
window.confirmarSenha = confirmarSenha;

document.addEventListener('click', e => { const b = e.target.closest('[data-fechar]'); if (b) b.closest('dialog').close('cancel'); });

iniciar();
</script>
