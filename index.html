<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>Gestão EM - 3º B.C.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1216;--panel:#171b21;--linha:#262c35;--txt:#e9ecf1;--mut:#8b94a3;--red:#c8102e;--red2:#e0203f;--ok:#2ed573}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:12px 28px;background:#0b0d10;border-bottom:2px solid var(--red)}
header img{height:44px}
header .marca{flex:1;line-height:1.25}
header b{font-size:1rem}
header small{display:block;color:var(--mut)}
#usuario{color:var(--mut);font-size:.8rem}
nav{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--linha);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:14px 16px;font:inherit;cursor:pointer;white-space:nowrap}
nav button[aria-current=true]{color:var(--txt);border-color:var(--red)}
main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:32px 28px}
h1{font-size:1.3rem;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.card{background:var(--panel);border:1px solid var(--linha);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:1rem}
a.card{color:inherit;text-decoration:none}
a.card:hover{border-color:var(--red)}
a.card p{color:var(--mut);font-size:.875rem}
label{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--mut);font-weight:600}
input,select,textarea{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--linha);border-radius:6px;padding:10px 12px}
textarea{min-height:80px;resize:vertical}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn{background:var(--red);color:#fff;border:0;border-radius:6px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--red2)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:none;border:1px solid var(--linha);color:var(--txt)}
.btn.ghost:hover{border-color:var(--mut)}
.cont{color:var(--mut);font-size:.85rem}
.acoes{display:flex;gap:10px;justify-content:flex-end}
dialog{margin:auto;background:var(--panel);color:var(--txt);border:1px solid var(--linha);border-top:3px solid var(--red);border-radius:8px;padding:24px;width:min(720px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog form,.col{display:flex;flex-direction:column;gap:14px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.tw{overflow:auto;margin-top:14px;max-height:55vh}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:10px;border-bottom:1px solid var(--linha);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
td.nw{white-space:nowrap}
.mini{background:none;border:1px solid var(--linha);color:var(--txt);border-radius:4px;padding:4px 10px;cursor:pointer;font:inherit;font-size:.78rem}
.mini:hover{border-color:var(--mut)}
.mini.perigo:hover{border-color:var(--red);color:#ff6b81}
.overlay{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:20px}
.overlay[hidden]{display:none}
.overlay .card{width:min(400px,100%);text-align:center}
.overlay img{width:96px;margin:0 auto}
.msg-erro{color:#ff6b81;font-size:.85rem}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px;z-index:100}
.toast{background:#1f2a33;border-left:3px solid var(--ok);padding:12px 16px;border-radius:6px;font-size:.875rem;max-width:340px}
.toast.erro{border-color:var(--red)}
footer{text-align:center;color:var(--mut);font-size:.75rem;padding:20px}
@media (max-width:600px){header,nav{padding-inline:16px}main{padding:24px 16px}}
</style>
</head>
<body>

<!-- Tela de login -->
<div id="login" class="overlay" hidden>
  <form id="fLogin" class="card">
    <img src="Brasão_3BC.png" alt="Brasão do 3º B.C." onerror="this.hidden=true">
    <h2>Acesso restrito</h2>
    <label>E-mail da seção<input type="email" id="lEmail" autocomplete="username" required></label>
    <label>Senha<input type="password" id="lSenha" autocomplete="current-password" required></label>
    <p id="erroLogin" class="msg-erro" hidden></p>
    <button class="btn" id="bLogin">Entrar</button>
  </form>
</div>

<header>
  <img src="Brasão_3BC.png" alt="" onerror="this.hidden=true">
  <div class="marca"><b>Polícia Militar do Estado de São Paulo</b><small>Painel de Gestão · 3º Batalhão de Caçadores</small></div>
  <span id="usuario"></span>
  <button class="btn ghost" id="sair" hidden>Sair</button>
</header>
<nav id="abas" hidden></nav>
<main id="conteudo"></main>
<footer>Uso restrito · 3º Batalhão de Caçadores</footer>

<!-- Registros de inquéritos -->
<dialog id="dReg">
  <div class="topo"><h2 id="rTitulo"></h2><button class="mini" data-fechar>Fechar</button></div>
  <input type="search" id="rBusca" placeholder="Buscar por número, data ou assunto" aria-label="Buscar">
  <div class="tw"><table><thead><tr><th>Número</th><th>Data</th><th>Assunto</th><th></th></tr></thead><tbody id="rCorpo"></tbody></table></div>
</dialog>

<!-- Editar registro -->
<dialog id="dEd">
  <form id="fEd">
    <h2 id="eTitulo">Editar registro</h2>
    <label>Data de instauração<input type="date" id="eData" required></label>
    <label>Assunto<textarea id="eAssunto" required></textarea></label>
    <div class="acoes"><button type="button" class="btn ghost" data-fechar>Cancelar</button><button class="btn">Salvar alterações</button></div>
  </form>
</dialog>

<!-- Confirmação por senha -->
<dialog id="dSenha">
  <form id="fSenha">
    <h2>Confirme sua senha</h2>
    <p id="sTexto" class="cont"></p>
    <input type="password" id="sSenha" autocomplete="current-password" aria-label="Senha" required>
    <p id="sErro" class="msg-erro" hidden>Senha incorreta.</p>
    <div class="acoes"><button type="button" class="btn ghost" data-fechar>Cancelar</button><button class="btn" id="bSenha">Confirmar</button></div>
  </form>
</dialog>

<div id="toasts" aria-live="polite"></div>

<script>
/* =====================================================================
   1) CONFIGURAÇÃO - é aqui que você faz as alterações do dia a dia
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://xxzmlddpmmgwhbotutsj.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4em1sZGRwbW1nd2hib3R1dHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1OTY3MjksImV4cCI6MjEwNjE3MjcyOX0.7d1iqK1Se3luzS6aZI38enGUQHXOXpjwlnyzPNZHAiI',
  URL_FOLGAS: 'https://script.google.com/macros/s/AKfycby6MaQTwhw_QePtaJLhhvJzKOxK7nVd8d5wFGhRj6WNh_MoH0YfjpvBoELPaJ8PySzz0g/exec',
  URL_OPERACOES: 'https://script.google.com/macros/s/AKfycbwU2bZX56SWM4Sc3hCc8JrAMN2sZz2H-R-7o_vIYRcdqRTduQnvyhuXpLObkvtNOHjv/exec',
  URL_EVENTOS: 'https://script.google.com/macros/s/AKfycbyB_rE1EojyondUq-aYihCWmVFOeyJfWLx2conKDn0YcUQz8cBYm0e5ZaymvpjB8T9v/exec',
  UNIDADE: '3BPMI',            // aparece na numeração: 3BPMI - 012/06/2026
  CODIGO: '06',
  MINUTOS_INATIVIDADE: 15      // sai sozinho após esse tempo sem uso
};

// Lista de oficiais do formulário de folgas (um por linha, entre aspas)
const NOMES = [
  'Ten Cel PM Eduardo','Maj PM Martins Ribeiro','Maj PM Luana','Cap PM Cravero','Cap PM Del Vecchio',
  'Cap PM André Luís','Ten PM Felipe Carvalho','Ten PM Ribeiro','Ten PM Feitosa','Ten PM Natalia',
  'Ten PM Derick','Ten PM Chevchuk','Ten PM Zanardo','Ten PM Larissa Muniz','Ten PM Borgo'
];

// Formulários que enviam para o Google Agenda (cada "id" é o nome do campo enviado)
const FORMS = {
  folga: {
    titulo: 'Agendar folga', botao: 'Enviar folga', url: CONFIG.URL_FOLGAS, acao: 'folga',
    ok: 'Folga enviada e registrada no calendário.',
    campos: [
      {id:'nome', label:'Nome', tipo:'select', opcoes:NOMES, req:1},
      {id:'data_folga', label:'Data desejada', tipo:'date', req:1},
      {id:'tipo_folga', label:'Tipo de folga', tipo:'select', req:1,
       opcoes:['Mensal','Produtividade','Horas Passadas','Concessão','Semanal','Meio Expediente','Outra']},
      {id:'especifique', label:'Especifique (obrigatório se o tipo for Outra)', tipo:'text'}
    ],
    validar: d => d.tipo_folga === 'Outra' && !d.especifique.trim() ? 'Preencha o campo "Especifique".' : null
  },
  operacao: {
    titulo: 'Agendar operação', botao: 'Criar operação', url: CONFIG.URL_OPERACOES, acao: 'operacao',
    ok: 'Operação criada e registrada no calendário.',
    campos: [
      {id:'data_inicio', label:'Data de início', tipo:'date', req:1},
      {id:'data_termino', label:'Data de término', tipo:'date', req:1},
      {id:'nome_operacao', label:'Nome da operação', tipo:'text', req:1, ph:'Ex: Operação Impacto'},
      {id:'descricao_operacao', label:'Descrição', tipo:'textarea', ph:'Detalhamento da operação'}
    ],
    validar: d => d.data_termino < d.data_inicio ? 'A data de término não pode ser anterior ao início.' : null
  },
  evento: {
    titulo: 'Agendar solenidade ou evento', botao: 'Registrar evento', url: CONFIG.URL_EVENTOS, acao: 'solenidade',
    ok: 'Evento registrado no calendário.',
    campos: [
      {id:'data_evento', label:'Data do evento', tipo:'date', req:1},
      {id:'nome_evento', label:'Nome da solenidade ou evento', tipo:'text', req:1, ph:'Ex: Passagem de Comando'},
      {id:'local_evento', label:'Local', tipo:'text'},
      {id:'descricao_evento', label:'Descrição e observações', tipo:'textarea'}
    ]
  }
};

// Seções e o que aparece em cada uma. Tipos de item: form, link, inq
const SECOES = {
  p1: {nome:'P/1 · Seção de Pessoal', itens:[
    {form:'folga'},
    {link:'Calendário de folgas', texto:'Folgas programadas dos oficiais do Batalhão.', url:'https://calendar.google.com/calendar/embed?src=3bpmioficiais%40gmail.com&ctz=America%2FSao_Paulo'},
    {link:'Efetivo', texto:'Controle de pessoal e atribuições da tropa.', url:'https://docs.google.com/spreadsheets/d/1AMWgGsep2hu1gIB7h6hqOBqyu3tgyKZ0FChFaM9GAOk/edit?usp=drive_link'}
  ]},
  p3: {nome:'P/3 · Seção de Operações', itens:[
    {form:'operacao'},
    {link:'Calendário de operações', texto:'Agenda oficial com a programação das operações.', url:'https://calendar.google.com/calendar/embed?src=0825099768be603c9f8bcfb99fdd6c322279e525ca4a6929693938275d6592f4%40group.calendar.google.com&ctz=America%2FSao_Paulo'}
  ]},
  p4: {nome:'P/4 · Seção de Logística', itens:[
    {link:'Viaturas', texto:'Frota, manutenção e disponibilidade dos veículos oficiais.', url:'https://docs.google.com/spreadsheets/d/19HPuo13AXZRe3hMUMIQBvqwq9lf-hLsbTUOxkqDMi4c/edit?usp=drive_link'}
  ]},
  p5: {nome:'P/5 · Seção de Comunicação Social', itens:[
    {form:'evento'},
    {link:'Calendário de solenidades', texto:'Solenidades e eventos do Batalhão.', url:'https://calendar.google.com/calendar/embed?src=c4e06b5453a15e7965978a2e937a2b7cd3738a308709aefa84361f80ce013f8f%40group.calendar.google.com&ctz=America%2FSao_Paulo'}
  ]},
  sjd: {nome:'SPJMD · Seção de Polícia Judiciária Militar e Disciplina', itens:[{inq:'IPM'},{inq:'IP'}]}
};

/* =====================================================================
   2) CÓDIGO DO SISTEMA - normalmente não precisa mexer daqui para baixo
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtData = d => d ? d.split('-').reverse().join('/') : '';
const fmtNum = r => `${String(r.numeracao).padStart(3,'0')}/${CONFIG.CODIGO}/${r.ano}`;
const db = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
let usuario = null, perfil = null, tipoAtual = '', registros = [], editando = null;

function aviso(msg, erro) {
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' erro' : '');
  t.textContent = msg;
  $('#toasts').append(t);
  setTimeout(() => t.remove(), 5000);
}

/* ---------- Login e sessão ---------- */
$('#fLogin').onsubmit = async e => {
  e.preventDefault();
  const b = $('#bLogin'), er = $('#erroLogin');
  b.disabled = true; er.hidden = true;
  const { error } = await db.auth.signInWithPassword({ email: $('#lEmail').value.trim(), password: $('#lSenha').value });
  b.disabled = false;
  if (error) {
    er.textContent = error.status === 400 ? 'E-mail ou senha incorretos.' : 'Não foi possível conectar. Verifique a internet e tente novamente.';
    er.hidden = false; return;
  }
  $('#lSenha').value = '';
  iniciar();
};

async function iniciar() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { $('#login').hidden = false; return; }
  usuario = session.user;
  const { data } = await db.from('perfis').select('secao').maybeSingle();
  perfil = data?.secao;
  if (!perfil) {
    await db.auth.signOut();
    $('#login').hidden = false;
    aviso('Seu e-mail não está vinculado a nenhuma seção. Procure o administrador.', 1);
    return;
  }
  $('#login').hidden = true;
  $('#usuario').textContent = usuario.email;
  $('#sair').hidden = false;
  montar();
  vigiarInatividade();
}

async function sair() { await db.auth.signOut(); location.reload(); }
$('#sair').onclick = sair;

let relogio;
function vigiarInatividade() {
  const zerar = () => { clearTimeout(relogio); relogio = setTimeout(sair, CONFIG.MINUTOS_INATIVIDADE * 60000); };
  ['click','keydown','mousemove','touchstart'].forEach(ev => addEventListener(ev, zerar, { passive: true }));
  zerar();
}

/* ---------- Navegação entre seções ---------- */
function permitidas() { return perfil === 'admin' ? Object.keys(SECOES) : [perfil].filter(k => SECOES[k]); }

function montar() {
  const chaves = permitidas();
  $('#abas').hidden = chaves.length < 2;
  $('#abas').innerHTML = chaves.map(k => `<button data-aba="${k}">${esc(SECOES[k].nome)}</button>`).join('');
  addEventListener('hashchange', () => abrir(location.hash.slice(1)));
  abrir(location.hash.slice(1));
}

function abrir(k) {
  const chaves = permitidas();
  if (!chaves.includes(k)) k = chaves[0];
  if (!k) return;
  document.querySelectorAll('#abas button').forEach(b => b.setAttribute('aria-current', b.dataset.aba === k));
  $('#conteudo').innerHTML = `<h1>${esc(SECOES[k].nome)}</h1><div class="grid">${SECOES[k].itens.map(desenharItem).join('')}</div>`;
  contar();
}
$('#abas').onclick = e => { const b = e.target.closest('[data-aba]'); if (b) location.hash = b.dataset.aba; };

function desenharItem(i) {
  if (i.link) return `<a class="card" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer"><h2>${esc(i.link)}</h2><p>${esc(i.texto)}</p></a>`;
  if (i.inq) return `<div class="card"><h2>${i.inq === 'IPM' ? 'Inquérito Policial Militar (IPM)' : 'Inquérito Policial (IP)'}</h2>
    <form class="col" data-inq="${i.inq}">
      <label>Data de instauração<input type="date" name="data" required></label>
      <label>Assunto<textarea name="assunto" required></textarea></label>
      <button class="btn">Cadastrar ${i.inq}</button>
    </form>
    <button class="btn ghost" data-ver="${i.inq}">Ver registros</button>
    <p class="cont">Total instaurados: <b id="cont${i.inq}">-</b></p></div>`;
  const f = FORMS[i.form];
  const campos = f.campos.map(c => {
    const at = `id="${c.id}" name="${c.id}"${c.req ? ' required' : ''} placeholder="${esc(c.ph || '')}"`;
    const el = c.tipo === 'select' ? `<select id="${c.id}" name="${c.id}"${c.req ? ' required' : ''}><option value="">Selecione</option>${c.opcoes.map(o => `<option>${esc(o)}</option>`).join('')}</select>`
      : c.tipo === 'textarea' ? `<textarea ${at}></textarea>` : `<input type="${c.tipo}" ${at}>`;
    return `<label>${esc(c.label)}${el}</label>`;
  }).join('');
  return `<div class="card"><h2>${esc(f.titulo)}</h2><form class="col" data-form="${i.form}">${campos}<button class="btn">${esc(f.botao)}</button></form></div>`;
}

/* ---------- Envio dos formulários ---------- */
$('#conteudo').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, b = $('button', f), txt = b.textContent;
  b.disabled = true; b.textContent = 'Enviando…';
  try {
    if (f.dataset.inq) await cadastrarInq(f); else await enviarForm(f);
  } catch (err) { console.error(err); aviso('Não foi possível concluir. Tente novamente.', 1); }
  b.disabled = false; b.textContent = txt;
});

async function enviarForm(f) {
  const def = FORMS[f.dataset.form], d = {};
  def.campos.forEach(c => d[c.id] = f.elements[c.id].value);
  const msg = def.validar?.(d);
  if (msg) return aviso(msg, 1);
  await fetch(def.url, { method: 'POST', body: new URLSearchParams({ acao: def.acao, ...d }) });
  aviso(def.ok); f.reset();
}

/* ---------- Inquéritos (IPM / IP) ---------- */
async function cadastrarInq(f) {
  const t = f.dataset.inq;
  const { data, error } = await db.from('inqueritos_pm')
    .insert({ tipo: t, data_instauracao: f.elements.data.value, assunto: f.elements.assunto.value.trim() })
    .select().single();
  if (error) throw error;
  aviso(`${t} cadastrado: ${CONFIG.UNIDADE} - ${fmtNum(data)}`);
  f.reset(); contar();
}

async function contar() {
  for (const t of ['IPM', 'IP']) {
    const el = $('#cont' + t); if (!el) continue;
    const { count } = await db.from('inqueritos_pm').select('*', { count: 'exact', head: true }).eq('tipo', t).eq('excluido', false);
    el.textContent = count ?? '-';
  }
}

$('#conteudo').addEventListener('click', e => {
  const b = e.target.closest('[data-ver]');
  if (b) { tipoAtual = b.dataset.ver; $('#rTitulo').textContent = `Registros de ${tipoAtual}`; $('#rBusca').value = ''; $('#dReg').showModal(); carregar(); }
});

async function carregar() {
  $('#rCorpo').innerHTML = '<tr><td colspan="4">Carregando…</td></tr>';
  const { data, error } = await db.from('inqueritos_pm').select('*').eq('tipo', tipoAtual).eq('excluido', false).order('numeracao', { ascending: false });
  if (error) { $('#rCorpo').innerHTML = '<tr><td colspan="4" class="msg-erro">Erro ao carregar os registros.</td></tr>'; return; }
  registros = data; listar();
}

function listar() {
  const q = $('#rBusca').value.toLowerCase();
  const l = registros.filter(r => `${fmtNum(r)} ${fmtData(r.data_instauracao)} ${r.assunto}`.toLowerCase().includes(q));
  $('#rCorpo').innerHTML = l.length ? l.map(r => `<tr>
      <td class="nw"><b>${fmtNum(r)}</b></td><td class="nw">${fmtData(r.data_instauracao)}</td><td>${esc(r.assunto)}</td>
      <td class="nw"><button class="mini" data-ed="${esc(r.id)}">Editar</button> <button class="mini perigo" data-ex="${esc(r.id)}">Excluir</button></td></tr>`).join('')
    : '<tr><td colspan="4" class="cont">Nenhum registro encontrado.</td></tr>';
}
$('#rBusca').oninput = listar;

$('#rCorpo').addEventListener('click', async e => {
  const bEd = e.target.closest('[data-ed]'), bEx = e.target.closest('[data-ex]');
  if (!bEd && !bEx) return;
  const r = registros.find(x => String(x.id) === (bEd || bEx).dataset[bEd ? 'ed' : 'ex']);
  if (!r) return;
  if (bEd) {
    if (!await confirmarSenha(`Editar ${tipoAtual} ${fmtNum(r)}.`)) return;
    editando = r;
    $('#eTitulo').textContent = `Editar ${tipoAtual} ${fmtNum(r)}`;
    $('#eData').value = r.data_instauracao; $('#eAssunto').value = r.assunto;
    $('#dEd').showModal();
  } else {
    if (!await confirmarSenha(`Excluir ${tipoAtual} ${fmtNum(r)}. O registro sai da lista e fica guardado no histórico.`)) return;
    const { error } = await db.from('inqueritos_pm').update({ excluido: true }).eq('id', r.id);
    if (error) return aviso('Não foi possível excluir. Verifique sua permissão.', 1);
    aviso('Registro excluído.'); carregar(); contar();
  }
});

$('#fEd').onsubmit = async e => {
  e.preventDefault();
  const { error } = await db.from('inqueritos_pm').update({ data_instauracao: $('#eData').value, assunto: $('#eAssunto').value.trim() }).eq('id', editando.id);
  if (error) return aviso('Não foi possível salvar. Verifique sua permissão.', 1);
  $('#dEd').close(); aviso('Registro atualizado.'); carregar();
};

/* ---------- Confirmação por senha (para editar e excluir) ---------- */
function confirmarSenha(texto) {
  return new Promise(resolve => {
    const d = $('#dSenha'); let tentativas = 0;
    $('#sTexto').textContent = texto; $('#sSenha').value = ''; $('#sErro').hidden = true;
    d.returnValue = ''; d.showModal(); $('#sSenha').focus();
    d.onclose = () => resolve(d.returnValue === 'ok');
    $('#fSenha').onsubmit = async e => {
      e.preventDefault();
      const b = $('#bSenha'); b.disabled = true;
      // Cliente temporário: confere a senha sem trocar a sessão de quem está logado
      const teste = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
      const { error } = await teste.auth.signInWithPassword({ email: usuario.email, password: $('#sSenha').value });
      b.disabled = false;
      if (!error) return d.close('ok');
      $('#sErro').hidden = false; $('#sSenha').value = '';
      if (++tentativas >= 3) { d.close('cancel'); aviso('Muitas tentativas incorretas.', 1); }
    };
  });
}

document.addEventListener('click', e => { const b = e.target.closest('[data-fechar]'); if (b) b.closest('dialog').close('cancel'); });

iniciar();
</script>
